<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Plannotator Inbox · Executor</title>
  </head>
  <body>
    <div
      hidden
      id="deployment-changed"
      role="status"
      style="position:fixed;z-index:99999;top:8px;left:50%;transform:translateX(-50%);background:#fff3cd;color:#332701;padding:12px;border:1px solid #b79b41;border-radius:8px"
    >
      A new deployment is available. Copy any unsent draft, then
      <button onclick="location.reload()" type="button">Reload Inbox</button>.
    </div>
    <div
      hidden
      id="location-registration-failed"
      role="status"
      style="position:fixed;z-index:99998;bottom:8px;left:50%;transform:translateX(-50%);background:#fff3cd;color:#332701;padding:12px;border:1px solid #b79b41;border-radius:8px"
    >
      Agent links could not be registered. Reload Inbox to retry; replies and
      annotations remain available.
    </div>
    <div id="root"></div>
    <script src="./host.ts" type="module"></script>
  </body>
</html>
