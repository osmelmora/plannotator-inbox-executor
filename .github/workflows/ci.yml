name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: jdx/mise-action@v3
      - name: Install locked development tooling
        run: mise exec -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Install locked app dependencies
        run: mise exec -- pnpm --dir app install --frozen-lockfile --ignore-scripts
      - name: Lint, test, typecheck, build, and check publication
        run: mise exec -- pnpm verify
